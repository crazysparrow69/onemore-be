name: CI

# No path filters: `ci-ok` is a required check, and a required check that never
# runs blocks the merge forever.
#
# `push` checks every commit on every branch. `pull_request` stays for PRs from
# forks (their pushes never reach this repository). A PR from a branch of this
# repository therefore gets both runs; that is intended.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# The jobs use no secrets, and `pull_request_target` is not used on purpose (it
# is the classic hole of public repositories).
permissions:
  contents: read

# A newer commit cancels the older run of the same event and branch. The event
# name is part of the key so a `push` run never cancels the `pull_request` run
# of the same commit (that would leave a cancelled `ci-ok` on it).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: ESLint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: tsc
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: pnpm test
      - name: E2E tests
        run: pnpm test:e2e

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # `oasdiff` compares with `main`, so the history must be there.
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Generate openapi.json
        run: pnpm openapi:generate

      - name: openapi.json is up to date
        run: |
          # `status`, not `diff`: it also catches a file that is not committed yet.
          stale=0
          for app in core-service nutrition-service; do
            if [ -n "$(git status --porcelain -- "apps/$app/openapi.json")" ]; then
              git diff -- "apps/$app/openapi.json" || true
              echo "::error::apps/$app/openapi.json is stale. Run 'pnpm openapi:generate' and commit it."
              stale=1
            fi
          done
          exit "$stale"

      # A pull request only: on `push` to `main` the same change was already
      # checked on its pull request.
      - name: No breaking API changes against main
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        env:
          # Pinned. Bump on purpose and read the release notes.
          OASDIFF_IMAGE: tufin/oasdiff:v1.39.0
        run: |
          failed=0
          for app in core-service nutrition-service; do
            spec="apps/$app/openapi.json"
            if ! git cat-file -e "origin/main:$spec" 2>/dev/null; then
              echo "::notice::main has no $spec yet, nothing to compare with."
              continue
            fi
            dir="$RUNNER_TEMP/$app"
            mkdir -p "$dir"
            git show "origin/main:$spec" > "$dir/base.json"
            cp "$spec" "$dir/head.json"
            ERR_IGNORE=()
            if [ -s "apps/$app/openapi-breaking-ignore.txt" ]; then
              cp "apps/$app/openapi-breaking-ignore.txt" "$dir/ignore.txt"
              ERR_IGNORE=(--err-ignore /specs/ignore.txt)
            fi
            {
              echo "### API changes against main: $app"
              echo '```'
              docker run --rm -v "$dir:/specs:ro" "$OASDIFF_IMAGE" \
                changelog /specs/base.json /specs/head.json || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            docker run --rm -v "$dir:/specs:ro" "$OASDIFF_IMAGE" \
              breaking /specs/base.json /specs/head.json \
              --fail-on ERR "${ERR_IGNORE[@]}" || failed=1
          done
          exit "$failed"

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core-service
            smoke_env: |
              CLOUDINARY_CLOUD_NAME=smoke
              CLOUDINARY_API_KEY=1
              CLOUDINARY_API_SECRET=smoke
              CLOUDINARY_FOLDER=smoke
          - service: nutrition-service
            smoke_env: ''
    env:
      IMAGE: onemore/${{ matrix.service }}:ci
      CONTAINER: smoke-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          target: runtime
          tags: ${{ env.IMAGE }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Smoke test the image
        env:
          APP_VERSION: ci-${{ github.sha }}
          SMOKE_ENV: ${{ matrix.smoke_env }}
        run: |
          extra=()
          while IFS= read -r line; do
            [ -n "$line" ] && extra+=(-e "$line")
          done <<< "$SMOKE_ENV"
          docker run -d --name "$CONTAINER" -p 8080:8080 \
            -e NODE_ENV=production \
            -e PORT=8080 \
            -e LOG_LEVEL=info \
            -e APP_VERSION="$APP_VERSION" \
            -e DATABASE_URL=postgresql://smoke:smoke@127.0.0.1:1/smoke \
            -e NEON_AUTH_URL=https://auth.example.test/neondb/auth \
            "${extra[@]}" \
            "$IMAGE"
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health -o health.json; then
              break
            fi
            sleep 1
          done
          cat health.json
          grep -q "\"version\":\"$APP_VERSION\"" health.json

      - name: Container logs
        if: failure()
        run: docker logs "$CONTAINER" || true

      - name: Cleanup
        if: always()
        run: docker rm -f "$CONTAINER" || true

  # The only check required by the `main` ruleset. It also succeeds when jobs are
  # skipped, which a plain required check would not.
  ci-ok:
    if: always()
    needs: [lint, typecheck, test, contracts, image]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
